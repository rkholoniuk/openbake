---
# Static parse of every role for `ansible-playbook --syntax-check`.
# apply.yml loads roles with include_role, which syntax-check does not follow,
# so this playbook lists them with the static `roles:` keyword instead.
- name: Syntax check all roles
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ws_target: image
    ws_user: user
    ws_uid: 1000
    ws_home: /home/user
    ws_workspace: /home/user/workspace
    ws_download_cache: /var/cache/ws
    ws_arch: { deb: amd64, gnu: x86_64, node: x64 }
  roles:
    - base
    - git
    - cli_tools
    - runtimes
    - neovim
    - code_server
    - postgres
    - data_sample
    - agents
    - firewall
    - hardening
    - auto_updates
    - dotfiles
    - hello_custom
