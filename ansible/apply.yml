---
- name: Apply workspace roles
  hosts: localhost
  connection: local
  gather_facts: true
  gather_subset: [min]
  vars:
    # image: inside `docker build`; host: a real machine (roles assert what they support).
    ws_target: host
    # Shared by all roles; override with WSV_WS_USER etc. if you need another user.
    ws_user: user
    ws_uid: 1000
    ws_home: /home/user
    ws_workspace: /home/user/workspace
    ws_download_cache: /var/cache/ws
    ws_arch_map:
      x86_64: { deb: amd64, gnu: x86_64, node: x64 }
      aarch64: { deb: arm64, gnu: arm64, node: arm64 }
    ws_arch: "{{ ws_arch_map[ansible_facts.architecture] }}"
    # Profiles: ansible/profiles/<name>.yml (copied to /opt/ansible/profiles in builds).
    ws_profile: ""
    ws_profiles_dir: "{{ playbook_dir }}/profiles"
  pre_tasks:
    - name: Load profile {{ ws_profile }}
      ansible.builtin.include_vars:
        file: "{{ ws_profiles_dir }}/{{ ws_profile }}.yml"
        name: ws_profile_data
      when: ws_profile | length > 0

    - name: Check the profile allows target {{ ws_target }}
      ansible.builtin.assert:
        that: ws_target in ws_profile_data.targets
        fail_msg: "profile {{ ws_profile }} allows targets {{ ws_profile_data.targets }}, not {{ ws_target }}"
        quiet: true
      when: ws_profile | length > 0

    - name: Need roles or a profile
      ansible.builtin.assert:
        that: ws_roles is defined or ws_profile | length > 0
        fail_msg: "pass roles (apply.sh base,git) or a profile (apply.sh - -e ws_profile=devbox)"
        quiet: true

    # Profile vars sit above role defaults and below -e extra vars.
    - name: Apply profile variables
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ (ws_profile_data.vars | default({}, true)) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"    # names only, never values
      when: ws_profile | length > 0

    # In builds /var/lib/apt/lists is a BuildKit cache mount. On a fresh builder
    # (new CI runner, pruned cache) it starts empty while cached layers above it
    # are restored, and roles' cache_valid_time would then skip `apt update`.
    - name: Find apt package lists
      ansible.builtin.find:
        paths: /var/lib/apt/lists
        patterns: "*_Packages*"
      register: ws_apt_lists
      check_mode: false
      when: ansible_facts.os_family == 'Debian'

    # Cache-only: it does not change what the image or host has installed, so it
    # also runs in check mode and never counts as a change.
    - name: Refresh apt package lists when they are empty
      ansible.builtin.apt:
        update_cache: true
      check_mode: false
      changed_when: false
      when:
        - ansible_facts.os_family == 'Debian'
        - ws_apt_lists.matched == 0
  tasks:
    - name: Apply role
      ansible.builtin.include_role:
        name: "{{ ws_role | trim }}"
      # Explicit roles win; otherwise all roles of the profile.
      loop: "{{ ws_roles.split(',') if ws_roles is defined else ws_profile_data.roles }}"
      loop_control:
        loop_var: ws_role
