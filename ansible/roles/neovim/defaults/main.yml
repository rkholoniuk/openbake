---
# Pinned release (moves to versions.yml in M3). "stable" also works but is a
# moving tag: no checksum, and every run re-downloads it.
neovim_version: v0.12.6
neovim_url: "https://github.com/neovim/neovim/releases/download/{{ neovim_version }}/nvim-linux-{{ ws_arch.gnu }}.tar.gz"
# sha256 per architecture, matching GitHub's asset digests for v0.12.6.
neovim_checksums:
  x86_64: sha256:474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87
  arm64: sha256:8f1f64a0bdb97247034038c3823c6cbad5bdf9ecd5751b85494b71c3ee04c815
neovim_checksum: "{{ neovim_checksums[ws_arch.gnu] if neovim_version == 'v0.12.6' else '' }}"

# What LazyVim and its plugins expect to find.
neovim_packages: [ripgrep, fd-find, fzf, build-essential, unzip, git, curl]

neovim_lazyvim: true
neovim_lazyvim_repo: https://github.com/LazyVim/starter
neovim_lazyvim_ref: main
# Pre-install plugins at build time so the first start is instant.
neovim_lazyvim_sync: true
