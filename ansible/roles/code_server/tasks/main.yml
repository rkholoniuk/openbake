---
# Probe, then act: the BuildKit download cache may be empty and is not state.
- name: Find installed code-server {{ code_server_version }}
  ansible.builtin.stat:
    path: "/opt/code-server-{{ code_server_version }}/bin/code-server"
  register: code_server_installed

- name: Check a pinned checksum exists for code-server {{ code_server_version }}
  ansible.builtin.assert:
    that: code_server_version in code_server_checksums and ws_arch.deb in code_server_checksums[code_server_version]
    fail_msg: "no sha256 for code-server {{ code_server_version }} ({{ ws_arch.deb }}) in code_server_checksums"
    quiet: true

- name: Install code-server {{ code_server_version }}
  when: not code_server_installed.stat.exists
  block:
    - name: Create download cache
      ansible.builtin.file:
        path: "{{ ws_download_cache }}/code-server"
        state: directory
        mode: "0755"

    - name: Download code-server
      ansible.builtin.get_url:
        url: "{{ code_server_url }}"
        dest: "{{ ws_download_cache }}/code-server/code-server-{{ code_server_version }}-{{ ws_arch.deb }}.tar.gz"
        checksum: "{{ code_server_checksums[code_server_version][ws_arch.deb] }}"
        mode: "0644"

    - name: Create install directory
      ansible.builtin.file:
        path: "/opt/code-server-{{ code_server_version }}"
        state: directory
        mode: "0755"

    - name: Unpack code-server
      ansible.builtin.unarchive:
        src: "{{ ws_download_cache }}/code-server/code-server-{{ code_server_version }}-{{ ws_arch.deb }}.tar.gz"
        dest: "/opt/code-server-{{ code_server_version }}"
        remote_src: true
        extra_opts: [--strip-components=1]

- name: Link code-server onto PATH
  ansible.builtin.file:
    src: "/opt/code-server-{{ code_server_version }}/bin/code-server"
    dest: /usr/local/bin/code-server
    state: link

- name: Create config and extensions directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0755"
  loop:
    - { path: /etc/code-server, owner: root }
    - { path: "{{ code_server_extensions_dir }}", owner: "{{ ws_user }}" }

- name: Configure code-server
  ansible.builtin.copy:
    dest: /etc/code-server/config.yaml
    mode: "0644"
    content: |
      bind-addr: 0.0.0.0:{{ code_server_port }}
      auth: {{ code_server_auth }}
      cert: false
      disable-telemetry: true
      disable-update-check: true
      extensions-dir: {{ code_server_extensions_dir }}

- name: List installed extensions
  ansible.builtin.command: >-
    code-server --extensions-dir {{ code_server_extensions_dir }} --list-extensions
  become: true
  become_user: "{{ ws_user }}"
  environment:
    HOME: "{{ ws_home }}"
  register: code_server_ext_installed
  changed_when: false
  failed_when: false    # code-server not installed yet in a check-mode preview
  check_mode: false
  when: code_server_extensions | length > 0

- name: Install missing extensions
  ansible.builtin.command: >-
    code-server --extensions-dir {{ code_server_extensions_dir }} --install-extension {{ item }}
  loop: "{{ code_server_extensions }}"
  become: true
  become_user: "{{ ws_user }}"
  environment:
    HOME: "{{ ws_home }}"
  register: code_server_ext_install
  # IDs may carry a version (publisher.name@1.2.3); compare without it, case-insensitively.
  when: (item.split('@')[0] | lower) not in (code_server_ext_installed.stdout_lines | default([]) | map('lower') | list)
  changed_when: code_server_ext_install.rc == 0    # runs only for missing extensions

- name: Install ws-code-server launcher
  ansible.builtin.copy:
    dest: /usr/local/bin/ws-code-server
    mode: "0755"
    content: |
      #!/bin/sh
      # Start code-server on the workspace folder (port {{ code_server_port }}).
      set -eu
      {% if code_server_auth == 'password' %}
      if [ -z "${PASSWORD:-}" ]; then
        echo "ws-code-server: set PASSWORD (auth: password)" >&2
        exit 1
      fi
      {% endif %}
      exec code-server --config /etc/code-server/config.yaml "${WS_WORKSPACE:-$HOME/workspace}"

- name: Record role in image manifest
  ansible.builtin.copy:
    dest: /etc/ws-image/code_server.json
    mode: "0644"
    content: >
      {{ {'role': 'code_server', 'code_server': code_server_version, 'port': code_server_port | int,
          'auth': code_server_auth, 'extensions': code_server_extensions} | to_json }}
