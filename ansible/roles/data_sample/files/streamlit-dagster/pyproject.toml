[project]
name = "streamlit-dagster-sample"
version = "0.1.0"
description = "Dagster assets load sales data into Postgres; a Streamlit app shows it."
requires-python = ">=3.11,<3.15"
dependencies = [
    "dagster==1.13.29",
    "dagster-webserver==1.13.29",
    "dagster-postgres==0.29.29",
    "pandas>=2.2",
    "numpy>=2.0",
    # SQLAlchemy 2.1 makes psycopg 3 the default Postgres driver; dagster-postgres
    # (1.13) still sends a NOTIFY that only works through psycopg2.
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2",
    "streamlit==1.67.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.dagster]
module_name = "pipeline.definitions"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
