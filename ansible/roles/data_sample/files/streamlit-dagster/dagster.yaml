# Dagster instance config: runs, events and schedules are stored in Postgres.
# ws-sample-data copies this to $DAGSTER_HOME and sets the DAGSTER_PG_* variables.
storage:
  postgres:
    postgres_db:
      username: { env: DAGSTER_PG_USERNAME }
      password: { env: DAGSTER_PG_PASSWORD }
      hostname: { env: DAGSTER_PG_HOST }
      db_name: { env: DAGSTER_PG_DB }
      port: 5432

telemetry:
  enabled: false
