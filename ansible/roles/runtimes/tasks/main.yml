---
- name: Check installer choice
  ansible.builtin.assert:
    that: runtimes_installer in ['mise', 'system']
    fail_msg: "runtimes_installer must be 'mise' or 'system', got '{{ runtimes_installer }}'"
    quiet: true

- name: Install with mise
  ansible.builtin.include_tasks: mise.yml
  when: runtimes_installer == 'mise'

- name: Install from distro packages
  ansible.builtin.include_tasks: system.yml
  when: runtimes_installer == 'system'

# uv comes from PyPI on both paths: one wheel, no GitHub download.
- name: Install python3-venv for the uv venv
  ansible.builtin.apt:
    name: python3-venv
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600

# uv is pinned by version and sha256 (files/uv-requirements.txt, wheels only).
# Probe, then act: reinstall when the requirements file changed or uv is missing.
- name: Create the uv venv
  ansible.builtin.command: python3 -m venv /opt/uv
  args:
    creates: /opt/uv/bin/pip

- name: Install the uv requirements file
  ansible.builtin.copy:
    src: uv-requirements.txt
    dest: /opt/uv/requirements.txt
    mode: "0644"

# The marker is written only after a successful install, so a failed upgrade
# is retried on the next run instead of being skipped.
- name: Read the installed uv marker
  ansible.builtin.slurp:
    src: /opt/uv/.ws-requirements-sha256
  register: runtimes_uv_marker
  failed_when: false
  check_mode: false

- name: Find uv
  ansible.builtin.stat:
    path: /opt/uv/bin/uv
  register: runtimes_uv_bin

- name: Install uv (hash-checked)
  ansible.builtin.command: "/opt/uv/bin/pip install --quiet --require-hashes --only-binary :all: -r /opt/uv/requirements.txt"
  register: runtimes_uv_install
  when: >-
    not runtimes_uv_bin.stat.exists or
    (runtimes_uv_marker.content | default('') | b64decode | trim) != (lookup('file', 'uv-requirements.txt') | hash('sha256'))
  changed_when: runtimes_uv_install.rc == 0    # runs only when the pin changed or uv is missing

- name: Record the installed uv requirements
  ansible.builtin.copy:
    dest: /opt/uv/.ws-requirements-sha256
    content: "{{ lookup('file', 'uv-requirements.txt') | hash('sha256') }}\n"
    mode: "0644"
  # Runs in check mode too, so a pending install or marker repair shows as changed.

- name: Put uv and uvx on PATH
  ansible.builtin.file:
    src: "/opt/uv/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: "{{ ansible_check_mode }}"    # target may only be simulated in check mode
  loop: [uv, uvx]

# Manifest: probe versions (read-only), then write the file only when its
# content changes.
- name: Read installed runtime versions
  become: true
  become_user: "{{ ws_user }}"
  ansible.builtin.shell: |
    set -eu
    export PATH="{{ mise_data_dir }}/shims:$PATH" MISE_DATA_DIR="{{ mise_data_dir }}"
    echo "python=$( (python3 --version 2>&1 || true) | awk '{print $2}')"
    echo "node=$(node --version 2>/dev/null || echo none)"
    echo "uv=$( (uv --version 2>/dev/null || echo "uv none") | awk '{print $2}')"
  args:
    executable: /bin/bash
  register: runtimes_versions
  changed_when: false
  check_mode: false

- name: Record role in image manifest
  vars:
    runtimes_v: "{{ dict(runtimes_versions.stdout_lines | map('split', '=', 1)) }}"
  ansible.builtin.copy:
    dest: /etc/ws-image/runtimes.json
    mode: "0644"
    content: >
      {{ {'role': 'runtimes', 'installer': runtimes_installer,
          'python_default': runtimes_v.python, 'python_versions': python_versions,
          'node_default': runtimes_v.node, 'node_versions': node_versions,
          'uv': runtimes_v.uv} | to_json }}

# Last, after every step that may write into the mise data dir as root.
- name: Let the workspace user add versions later
  ansible.builtin.file:
    path: "{{ mise_data_dir }}"
    owner: "{{ ws_user }}"
    group: "{{ ws_user }}"
    recurse: true
  when: runtimes_installer == 'mise'
