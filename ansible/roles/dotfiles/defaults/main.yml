---
dotfiles_role_targets: [host]

# Your dotfiles repository, https://host/path or git@host:path. Empty: the role
# does nothing. No credentials in the URL: use SSH or a git credential helper.
dotfiles_repo: ""

# Branch, tag or commit. Pin a commit: the repository's install script runs as
# you on every change of this ref.
dotfiles_ref: main

# Coder dotfiles convention: the first of these that exists and is executable
# is run from the checkout. Without one, top-level dotfiles are linked into the
# home directory and existing regular files are moved to <name>.bak. A name
# that is already a directory in the home directory (~/.config) is left alone.
dotfiles_install_scripts: [install.sh, install, bootstrap.sh, bootstrap, setup.sh, setup]

# Top-level entries that are never linked into the home directory: repository
# metadata, and key stores that must never be swapped for a checkout.
dotfiles_link_exclude: [.git, .github, .gitignore, .gitmodules, .gitattributes, .ssh, .gnupg]
