---
- name: Check agent list
  ansible.builtin.assert:
    that: agents | difference(agents_npm.keys() | list) | length == 0
    fail_msg: "Unknown agents {{ agents | difference(agents_npm.keys() | list) }}; known: {{ agents_npm.keys() | list }}"
    quiet: true

- name: Install agent helper packages
  ansible.builtin.apt:
    name: "{{ agents_packages }}"
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600

- name: Find Node
  ansible.builtin.command: node --version
  environment:
    PATH: "/opt/mise/shims:{{ ansible_env.PATH }}"
    MISE_DATA_DIR: /opt/mise
  register: agents_node
  changed_when: false
  failed_when: false
  check_mode: false    # read-only; the assert below needs the result

- name: Require a recent enough Node (add the runtimes role first)
  ansible.builtin.assert:
    that:
      - agents_node.rc == 0
      - (agents_node.stdout | regex_replace('^v', '')).split('.')[0] | int >= agents_node_min_major
    fail_msg: "Need Node >= {{ agents_node_min_major }}, found: {{ agents_node.stdout | default('none', true) }}"
    quiet: true

- name: Create {{ agents_prefix }}
  ansible.builtin.file:
    path: "{{ agents_prefix }}"
    state: directory
    mode: "0755"

- name: Install package.json and package-lock.json
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ agents_prefix }}/{{ item }}"
    mode: "0644"
  loop: [package.json, package-lock.json]

- name: Hash package.json and package-lock.json
  ansible.builtin.stat:
    path: "{{ agents_prefix }}/{{ item }}"
    checksum_algorithm: sha256
  loop: [package.json, package-lock.json]
  register: agents_files

# Probe, then act: node_modules matches when the marker written after the last
# successful install holds the sha256 of both files (as on disk).
- name: Work out the wanted install marker
  ansible.builtin.set_fact:
    agents_wanted_marker: >-
      {{ agents_files.results | map(attribute='stat.checksum') | map('default', 'missing') | join(' ') }}

- name: Read the installed marker
  ansible.builtin.slurp:
    src: "{{ agents_prefix }}/node_modules/.ws-install-sha256"
  register: agents_marker
  failed_when: false
  check_mode: false

- name: Install agent CLIs from the lockfile (npm ci, no install scripts)
  ansible.builtin.command: npm ci --ignore-scripts --no-fund --no-audit --prefix {{ agents_prefix }}
  environment:
    PATH: "/opt/mise/shims:{{ ansible_env.PATH }}"
    MISE_DATA_DIR: /opt/mise
    npm_config_ignore_scripts: "true"
  register: agents_npm_ci
  when: (agents_marker.content | default('') | b64decode | trim) != agents_wanted_marker
  changed_when: agents_npm_ci.rc == 0    # runs only when node_modules doesn't match the files

- name: Hash the allowed install scripts
  ansible.builtin.stat:
    path: "{{ agents_prefix }}/node_modules/{{ item.path }}"
    checksum_algorithm: sha256
  loop: "{{ agents_allowed_install_scripts }}"
  loop_control:
    label: "{{ item.path }}"
  register: agents_script_files
  when: agents_npm_ci is changed

- name: Refuse install scripts whose content was not reviewed
  ansible.builtin.assert:
    that: item.stat.exists and item.stat.checksum == item.item.sha256
    fail_msg: >-
      {{ item.item.path }} has sha256 {{ item.stat.checksum | default('missing') }}, reviewed is
      {{ item.item.sha256 }}: review the new script, then update agents_allowed_install_scripts
    quiet: true
  loop: "{{ agents_script_files.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: agents_npm_ci is changed

- name: Run reviewed install scripts
  ansible.builtin.command: node {{ item.path | basename }}
  args:
    chdir: "{{ agents_prefix }}/node_modules/{{ item.path | dirname }}"
  environment:
    PATH: "/opt/mise/shims:{{ ansible_env.PATH }}"
    MISE_DATA_DIR: /opt/mise
  loop: "{{ agents_allowed_install_scripts }}"
  loop_control:
    label: "{{ item.path }}"
  register: agents_scripts
  when: agents_npm_ci is changed
  changed_when: agents_scripts.rc == 0    # runs only after npm ci

- name: Record the installed files
  ansible.builtin.copy:
    dest: "{{ agents_prefix }}/node_modules/.ws-install-sha256"
    content: "{{ agents_wanted_marker }}\n"
    mode: "0644"
  # Runs in check mode too, so a pending install or marker repair shows as changed.

- name: Link agent CLIs onto PATH
  ansible.builtin.file:
    src: "{{ agents_prefix }}/node_modules/.bin/{{ agents_npm[item].bin }}"
    dest: "/usr/local/bin/{{ agents_npm[item].bin }}"
    state: link
    force: "{{ ansible_check_mode }}"    # target may only be simulated in check mode
  loop: "{{ agents }}"

# Images are rebuilt instead of self-updating; credentials come from the
# environment at run time (ANTHROPIC_API_KEY, OPENAI_API_KEY), never the image.
- name: Agent environment defaults
  ansible.builtin.copy:
    dest: /etc/profile.d/ws-agents.sh
    mode: "0644"
    content: |
      export DISABLE_AUTOUPDATER=1

- name: Record role in image manifest
  vars:
    agents_lock: "{{ lookup('file', 'package-lock.json') | from_json }}"
  ansible.builtin.copy:
    dest: /etc/ws-image/agents.json
    mode: "0644"
    content: >
      {{ {'role': 'agents', 'node': agents_node.stdout | default('none', true),
          'lockfile_sha256': agents_files.results[1].stat.checksum | default('none'),
          'linked': agents,
          'versions': dict(agents_npm | dict2items | map(attribute='key')
                           | zip(agents_npm | dict2items | map(attribute='value.package')
                                 | map('regex_replace', '^', 'node_modules/')
                                 | map('extract', agents_lock.packages) | map(attribute='version')))} | to_json }}
