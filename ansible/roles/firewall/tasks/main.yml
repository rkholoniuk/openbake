---
- name: Check the target is supported
  ansible.builtin.assert:
    that: ws_target in firewall_role_targets
    fail_msg: "firewall does not support ws_target={{ ws_target }}"
    quiet: true

- name: Check the rule sources
  ansible.builtin.assert:
    that: (item['from'] | default('any')) is match('^(any|[0-9a-fA-F:.]+(/[0-9]{1,3})?)$')
    fail_msg: "firewall_allow: 'from' must be any, an address or a CIDR, not {{ item['from'] | default('any') }}"
    quiet: true
  loop: "{{ firewall_allow }}"
  loop_control:
    label: "{{ item.port }}"

# Enabling ufw without a rule for the port this run uses would lock us out.
- name: Check the SSH port stays reachable
  ansible.builtin.assert:
    that: (ansible_port | default(22) | int) in (firewall_allow | map(attribute='port') | map('int') | list)
    fail_msg: >-
      firewall_allow has no rule for SSH port {{ ansible_port | default(22) }}; add one, or set
      firewall_require_ssh_rule=false if this host is managed another way
    quiet: true
  when: firewall_require_ssh_rule | bool

- name: Configure ufw
  become: true
  block:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present
        install_recommends: false
        update_cache: true
        cache_valid_time: 3600

    # In a check-mode preview on a machine without ufw the install above is only
    # simulated; the tasks below then have nothing to read and are skipped.
    - name: Find ufw
      ansible.builtin.stat:
        path: /usr/sbin/ufw
      register: firewall_ufw
      check_mode: false

    - name: Find Docker
      ansible.builtin.stat:
        path: /usr/bin/dockerd
      register: firewall_dockerd
      check_mode: false

    - name: Set the default policies
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: "^{{ item.key }}="
        line: '{{ item.key }}="{{ item.value }}"'
      loop:
        - { key: DEFAULT_INPUT_POLICY, value: DROP }
        - { key: DEFAULT_OUTPUT_POLICY, value: ACCEPT }
      loop_control:
        label: "{{ item.key }}"
      notify: Reload ufw
      when: firewall_ufw.stat.exists

    # `ufw show added` prints rules in command form (e.g. "ufw limit 22/tcp"),
    # also while ufw is inactive.
    - name: Read the rules ufw has
      ansible.builtin.command: ufw show added
      environment:
        LC_ALL: C
      register: firewall_added
      changed_when: false
      check_mode: false
      when: firewall_ufw.stat.exists

    # Rules are added before ufw is enabled, so the SSH rule is in place first.
    - name: Add missing rules
      ansible.builtin.command:
        argv: "{{ ['ufw'] + firewall_rule.split() }}"
      vars:
        firewall_proto: "{{ item.proto | default('tcp') }}"
        firewall_action: "{{ 'limit' if (item.limit | default(false) | bool) else 'allow' }}"
        firewall_rule: >-
          {{ firewall_action }}
          {{ (item.port ~ '/' ~ firewall_proto) if (item['from'] | default('any')) == 'any'
             else ('from ' ~ item['from'] ~ ' to any port ' ~ item.port ~ ' proto ' ~ firewall_proto) }}
      loop: "{{ firewall_allow }}"
      loop_control:
        label: "{{ firewall_rule }}"
      register: firewall_add
      changed_when: firewall_add.rc == 0
      when:
        - firewall_ufw.stat.exists
        - ('ufw ' ~ firewall_rule) not in firewall_added.stdout_lines

    # A second *filter block in after.rules; ufw loads it with its own rules.
    # DOCKER-USER sees traffic after DNAT, so published ports are matched with
    # the connection's original destination port (ctorigdstport).
    - name: Filter Docker-published ports
      ansible.builtin.blockinfile:
        path: /etc/ufw/after.rules
        marker: "# {mark} openbake firewall role: Docker-published ports"
        state: "{{ 'present' if firewall_dockerd.stat.exists else 'absent' }}"
        block: |
          *filter
          :DOCKER-USER - [0:0]
          -A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j RETURN
          {% for cidr in firewall_docker_local_cidrs %}
          -A DOCKER-USER -s {{ cidr }} -j RETURN
          {% endfor %}
          {% for rule in firewall_allow %}
          {% set src = '' if (rule['from'] | default('any')) == 'any' else ' -s ' ~ rule['from'] %}
          -A DOCKER-USER -p {{ rule.proto | default('tcp') }}{{ src }} -m conntrack --ctorigdstport {{ rule.port }} -j RETURN
          {% endfor %}
          -A DOCKER-USER -m conntrack --ctstate NEW -j DROP
          -A DOCKER-USER -j RETURN
          COMMIT
      notify: Reload ufw
      when: firewall_ufw.stat.exists

    # grep exits 0 on a match and 1 on none; anything else is an error.
    - name: Read whether ufw is enabled
      ansible.builtin.command: grep -qx ENABLED=yes /etc/ufw/ufw.conf
      register: firewall_enabled
      changed_when: false
      failed_when: firewall_enabled.rc not in [0, 1]
      check_mode: false
      when: firewall_ufw.stat.exists

    - name: Enable ufw
      ansible.builtin.command: ufw --force enable
      register: firewall_enable
      changed_when: firewall_enable.rc == 0
      when:
        - firewall_ufw.stat.exists
        - firewall_enabled.rc == 1
