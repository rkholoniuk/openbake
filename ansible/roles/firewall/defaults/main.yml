---
firewall_role_targets: [host]

# Inbound rules; everything else inbound is denied, outbound is allowed.
#   port   integer
#   proto  tcp | udp            (default tcp)
#   from   any | address | CIDR (default any)
#   limit  rate-limit new connections, for SSH (default false)
firewall_allow:
  - { port: "{{ ansible_port | default(22) }}", proto: tcp, from: any, limit: true }

# Refuse to run when the SSH port this run connects through is not in
# firewall_allow (enabling ufw would cut the connection). Set false only for
# hosts that are managed through another path, e.g. a console.
firewall_require_ssh_rule: true

# Docker publishes ports with its own iptables rules, which ufw does not see.
# When Docker is installed, DOCKER-USER rules drop new connections to published
# container ports unless the published port is in firewall_allow.
#
# Traffic that containers send themselves arrives on a Docker bridge and stays
# allowed; "+" is the iptables wildcard (br-+ matches every user-defined network).
firewall_docker_interfaces: [docker0, br-+, docker_gwbridge]

# Extra sources that may reach every published port. Empty by default: private
# ranges are not "local" (a neighbour in the same VPC or LAN is still outside
# this machine). Add a CIDR only for networks you trust with every container port.
firewall_docker_local_cidrs: []
