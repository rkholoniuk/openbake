---
- name: Check the target is supported
  ansible.builtin.assert:
    that: ws_target in cli_tools_role_targets
    fail_msg: "cli_tools does not support ws_target={{ ws_target }}"
    quiet: true

- name: Install command-line tools
  ansible.builtin.apt:
    name: "{{ cli_tools_packages }}"
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600

# Ubuntu renames these binaries (fdfind, batcat); expose the upstream names.
- name: Expose fd and bat under their upstream names
  ansible.builtin.file:
    src: "/usr/bin/{{ item.src }}"
    dest: "/usr/local/bin/{{ item.dest }}"
    state: link
  loop:
    - { src: fdfind, dest: fd }
    - { src: batcat, dest: bat }

# Probe, then act: the download cache may be empty and is not state.
- name: Read installed yq and gh versions
  ansible.builtin.command: "{{ item }}"
  loop:
    - /usr/local/bin/yq --version
    - /usr/local/bin/gh --version
  register: cli_tools_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install yq {{ cli_tools_yq_version }}
  when: ('version v' ~ cli_tools_yq_version) not in cli_tools_installed.results[0].stdout | default('')
  block:
    - name: Create download cache
      ansible.builtin.file:
        path: "{{ ws_download_cache }}/cli_tools"
        state: directory
        mode: "0755"

    - name: Download yq
      ansible.builtin.get_url:
        url: "https://github.com/mikefarah/yq/releases/download/v{{ cli_tools_yq_version }}/yq_linux_{{ ws_arch.deb }}"
        dest: "{{ ws_download_cache }}/cli_tools/yq-{{ cli_tools_yq_version }}-{{ ws_arch.deb }}"
        checksum: "{{ cli_tools_yq_checksums[ws_arch.deb] }}"
        mode: "0755"

    - name: Install yq binary
      ansible.builtin.copy:
        src: "{{ ws_download_cache }}/cli_tools/yq-{{ cli_tools_yq_version }}-{{ ws_arch.deb }}"
        dest: /usr/local/bin/yq
        remote_src: true
        mode: "0755"

- name: Install gh {{ cli_tools_gh_version }}
  when: ('gh version ' ~ cli_tools_gh_version ~ ' ') not in cli_tools_installed.results[1].stdout | default('')
  block:
    - name: Create download cache
      ansible.builtin.file:
        path: "{{ ws_download_cache }}/cli_tools"
        state: directory
        mode: "0755"

    - name: Download gh
      ansible.builtin.get_url:
        url: "https://github.com/cli/cli/releases/download/v{{ cli_tools_gh_version }}/gh_{{ cli_tools_gh_version }}_linux_{{ ws_arch.deb }}.tar.gz"
        dest: "{{ ws_download_cache }}/cli_tools/gh-{{ cli_tools_gh_version }}-{{ ws_arch.deb }}.tar.gz"
        checksum: "{{ cli_tools_gh_checksums[ws_arch.deb] }}"
        mode: "0644"

    - name: Install gh binary
      ansible.builtin.unarchive:
        src: "{{ ws_download_cache }}/cli_tools/gh-{{ cli_tools_gh_version }}-{{ ws_arch.deb }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        extra_opts: [--strip-components=2, "gh_{{ cli_tools_gh_version }}_linux_{{ ws_arch.deb }}/bin/gh"]

- name: Record role in image manifest
  ansible.builtin.copy:
    dest: /etc/ws-image/cli_tools.json
    mode: "0644"
    content: >
      {{ {'role': 'cli_tools', 'packages': cli_tools_packages,
          'yq': cli_tools_yq_version, 'gh': cli_tools_gh_version} | to_json }}
