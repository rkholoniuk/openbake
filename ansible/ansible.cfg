[defaults]
roles_path = /opt/roles
interpreter_python = /usr/bin/python3
localhost_warning = false
retry_files_enabled = false
display_skipped_hosts = false
nocows = true
forks = 1
result_format = yaml
# Secrets (docs/ansible-guidelines.md): never print module arguments, never
# write a log file. Do not set log_path or enable ANSIBLE_DEBUG.
display_args_to_stdout = false
# Facts: plays gather only the `min` subset. No fact cache on purpose: build
# steps and hosts change between runs, and cached facts would go stale.
fact_caching = memory

[ssh_connection]
# make host over SSH: one SSH round trip per task instead of several.
# Needs `requiretty` off in sudoers (Ubuntu default).
pipelining = true

[persistent_connection]
log_messages = false
